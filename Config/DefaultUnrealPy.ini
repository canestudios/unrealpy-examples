[/Script/UnrealPyCore.UnrealPySettings]
VenvPath=.venv
; The examples' classes (game modes, mannequins, actors) are found in this package.
+ClassPackages=examples
; NVIDIA Warp builds the fluid's GPU kernels from their Python source: a packaged game ships that module as
; source instead of bytecode.
+StageSource=examples/fluid/sim.py
