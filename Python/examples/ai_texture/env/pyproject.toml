# The model environment of the AI texture example: its own uv project, kept apart from the game's
# (the root pyproject.toml), so torch can never ship in a packaged game nor be removed by the editor's
# exact `uv sync --group dev`. Created outside Python/ (which packaging stages):
#   $env:UV_PROJECT_ENVIRONMENT = "<project>\Intermediate\AITexture\venv"
#   uv sync --project Python/examples/ai_texture/env --python <engine Python 3.11> --no-python-downloads
# See ../README.md.
[project]
name = "ai-texture-model"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.14.1",
    "diffusers==0.43.0",
    "transformers==5.23.0",
    "accelerate==1.16.0",
    "peft==0.21.3",
    "safetensors==0.8.0",
    "huggingface-hub==2.4.0",
    "numpy==2.4.6",
]

[tool.uv]
package = false
# Windows and x86-64 Linux only: the lock stays small and no macOS/ARM torch is resolved.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
# CUDA 13.0 build (driver 580+; Turing and newer GPUs): 1.99 GB wheel for Windows, CUDA libraries included.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
