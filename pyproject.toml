[project]
name = "unrealpy-examples"
version = "0.1.0"
description = "Runtime examples for UnrealPy: the Python ecosystem inside Unreal Engine games"
# Unreal Engine 5.8 embeds CPython 3.11; the lock also covers CPython 3.12 to 3.15.
requires-python = ">=3.11,<3.16"
# numpy and typing-extensions: what UnrealPy itself needs in every environment. NumPy supports 3.15 from 2.5.
dependencies = [
    "numpy==2.4.6; python_version < '3.15'",
    "numpy==2.5.5; python_version >= '3.15'",
    "typing-extensions==4.16.0",
]

# One group per example, so nobody downloads what they do not run: `uv sync --group <name>` installs one for
# the editor, `unrealpy package --group <name>` ships it in a packaged game.
[dependency-groups]
# security_camera: computer vision on the game's own camera.
vision = [
    "opencv-python-headless==5.1.0.95",
]
# learning_enemies: a small network trained while the game runs (the CPU build of torch).
learning = [
    "torch==2.15.0",
]
# live_analytics: playtest telemetry summarised and drawn in-game.
analytics = [
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]
# fluid: GPU kernels written in Python.
fluid = [
    "warp-lang==1.19.0",
]
# The demo scripts outside the engine: title cards and banners for the clips.
media = [
    "matplotlib==3.11.2",
]
test = [
    "pytest==9.2.0",
]
dev = [
    { include-group = "test" },
    { include-group = "media" },
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# Outside the engine only the unit tests run; Tests/unit/conftest.py loads UnrealPy's engine-less fake of `ue`.
testpaths = ["Tests/unit"]
pythonpath = ["Content/Python/unrealpy"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["Content/Python/unrealpy", "Plugins/UnrealPy/Content/Python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ue", "examples"]
